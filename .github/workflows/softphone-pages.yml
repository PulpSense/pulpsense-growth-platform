name: Softphone Pages

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "apps/softphone/**"
      - "apps/softphone-security/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/softphone-pages.yml"
  push:
    branches: [master]
    paths:
      - "apps/softphone/**"
      - "apps/softphone-security/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/softphone-pages.yml"
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the selected master commit after Production approval
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: softphone-pages-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A newer softphone build supersedes an older run, including one waiting for
  # Production approval, so stale approvals cannot block the current commit.
  cancel-in-progress: true

env:
  SOFTPHONE_PAGES_PROJECT: pulpsense-softphone-preview

jobs:
  verify:
    name: Verify softphone
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run softphone tests
        run: pnpm exec vitest run apps/softphone apps/softphone-security

      - name: Check softphone types
        run: pnpm --filter @pulpsense/softphone --filter @pulpsense/softphone-security check-types

      - name: Lint softphone
        run: pnpm exec eslint apps/softphone apps/softphone-security

      - name: Check softphone formatting
        run: pnpm exec prettier 'apps/softphone{,-security}/**/*.{css,html,js,json,mjs,ts}' --check

      - name: Build softphone
        run: pnpm --filter @pulpsense/softphone build

  deploy-preview:
    name: Deploy softphone preview
    needs: verify
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: Preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Preview configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Preview CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Preview CLOUDFLARE_API_TOKEN is not configured"; exit 1; }

      - name: Build Preview
        run: pnpm --filter @pulpsense/softphone build

      - name: Deploy Preview security service
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/softphone-security
          wranglerVersion: "4.120.0"
          command: deploy

      - name: Deploy Preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
          workingDirectory: apps/softphone
          wranglerVersion: "4.120.0"
          command: pages deploy dist --project-name=${{ env.SOFTPHONE_PAGES_PROJECT }} --branch=pr-${{ github.event.pull_request.number }}

      - name: Publish Preview URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: |
          printf '### Softphone Preview\n\n[%s](%s)\n' "$DEPLOYMENT_URL" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy softphone production
    needs: verify
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_production))
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Production configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Production CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Production CLOUDFLARE_API_TOKEN is not configured"; exit 1; }

      - name: Build Production
        run: pnpm --filter @pulpsense/softphone build

      - name: Deploy Production security service
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/softphone-security
          wranglerVersion: "4.120.0"
          command: deploy --config wrangler.production.toml

      - name: Select Production Pages config
        run: cp apps/softphone/wrangler.production.toml apps/softphone/wrangler.toml

      - name: Deploy Production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
          workingDirectory: apps/softphone
          wranglerVersion: "4.120.0"
          command: pages deploy dist --project-name=${{ env.SOFTPHONE_PAGES_PROJECT }} --branch=master

      - name: Publish Production URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          printf '### Softphone Production\n\n[%s](%s)\n' "$DEPLOYMENT_URL" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
